<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生育管理アプリ - plantcheck</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --primary: #2e7d32; --bg: #f4f6f8; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 16px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1, h2 { color: var(--primary); margin-top: 0; font-size: 1.5rem; }
    
    /* ユーザー情報・ログインヘッダー */
    .auth-header { display: flex; justify-content: space-between; align-items: center; background: #e8f5e9; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; }
    .login-btn { background: #4285f4; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .logout-btn { background: #757575; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; width: auto; margin-top: 0; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    button.submit-btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 8px; }
    button:hover { opacity: 0.9; }
    .error { color: #d32f2f; font-size: 14px; margin-top: 4px; display: none; background: #ffebee; padding: 8px; border-radius: 4px; }
    .filter-group { margin: 20px 0 10px; }
    .card { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 12px; position: relative; }
    .card-title { font-weight: bold; font-size: 1.1rem; color: var(--primary); }
    .card-date { color: #666; font-size: 0.85rem; margin-top: 2px; }
    .card-detail { margin: 8px 0; font-size: 0.95rem; }
    .delete-btn { background: #e53935; width: auto; padding: 6px 12px; font-size: 12px; position: absolute; top: 12px; right: 12px; margin-top: 0; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .chart-container { margin-top: 28px; position: relative; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>🌱 生育記録アプリ</h1>

  <!-- ログインエリア -->
  <div class="auth-header">
    <div id="userInfo" class="user-info hidden">
      <img id="userAvatar" class="user-avatar" src="" alt="ユーザーアイコン">
      <span id="userName" style="font-weight: bold; font-size: 0.95rem;"></span>
    </div>
    <div id="authButtons">
      <button id="loginBtn" class="login-btn">Googleでログイン</button>
      <button id="logoutBtn" class="logout-btn hidden">ログアウト</button>
    </div>
  </div>

  <!-- アプリ本体（ログイン時のみ表示） -->
  <div id="appContent" class="hidden">
    <!-- 入力フォーム -->
    <form id="plantForm">
      <div class="form-group">
        <label for="cropName">作物名 <span style="color:red">*</span></label>
        <input type="text" id="cropName" placeholder="例: トマト" required>
      </div>
      <div class="form-group">
        <label for="leafCount">葉枚数 (枚) <span style="color:red">*</span></label>
        <input type="number" id="leafCount" min="0" placeholder="例: 5" required>
      </div>
      <div class="form-group">
        <label for="height">草丈 (cm) <span style="color:red">*</span></label>
        <input type="number" id="height" min="0" step="0.1" placeholder="例: 15.5" required>
      </div>
      <div class="form-group">
        <label for="recordDate">日付 <span style="color:red">*</span></label>
        <input type="date" id="recordDate" required>
      </div>
      <div class="form-group">
        <label for="memo">メモ</label>
        <textarea id="memo" rows="3" placeholder="日当たりや水やりの様子など"></textarea>
      </div>
      <div id="errorMsg" class="error">すべての必須項目を正しく入力してください。</div>
      <button type="submit" class="submit-btn">保存する</button>
    </form>

    <hr style="margin: 24px 0; border: none; border-top: 1px solid #ddd;">

    <!-- 一覧表示 ＆ フィルター -->
    <h2>📋 記録一覧</h2>
    <div class="filter-group">
      <input type="text" id="filterInput" placeholder="🔍 作物名で絞り込み..." oninput="renderData()">
    </div>
    <div id="recordList"></div>

    <!-- グラフ表示 -->
    <div class="chart-container">
      <h2>📈 成長グラフ</h2>
      <canvas id="growthChart"></canvas>
    </div>
  </div>

  <!-- 未ログイン時の案内メッセージ -->
  <div id="loginNotice" style="text-align: center; padding: 40px 0; color: #666;">
    <p>🌱 記録を入力・閲覧するには、上のボタンからGoogleログインしてください。</p>
  </div>
</div>

<!-- Firebase SDK (v10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAiKjzvEGtJAYkhbwNPFcPqXNBnHhiC2Vw",
    authDomain: "yasai-3486c.firebaseapp.com",
    projectId: "yasai-3486c",
    storageBucket: "yasai-3486c.firebasestorage.app",
    messagingSenderId: "533888258181",
    appId: "1:533888258181:web:1f83895933057cfde699ec"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  const colRef = collection(db, "records");

  let allRecords = [];
  let chartInstance = null;

  document.getElementById('recordDate').valueAsDate = new Date();

  // ログイン処理
  document.getElementById('loginBtn').addEventListener('click', () => {
    signInWithPopup(auth, provider).catch(error => console.error("ログインエラー:", error));
  });

  // ログアウト処理
  document.getElementById('logoutBtn').addEventListener('click', () => {
    signOut(auth);
  });

  // ログイン状態の監視
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // ログイン時
      document.getElementById('userInfo').classList.remove('hidden');
      document.getElementById('userName').textContent = user.displayName;
      document.getElementById('userAvatar').src = user.photoURL;
      document.getElementById('loginBtn').classList.add('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      document.getElementById('appContent').classList.remove('hidden');
      document.getElementById('loginNotice').classList.add('hidden');
      
      // データ取得開始
      loadRecords();
    } else {
      // 未ログイン時
      document.getElementById('userInfo').classList.add('hidden');
      document.getElementById('loginBtn').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('appContent').classList.add('hidden');
      document.getElementById('loginNotice').classList.remove('hidden');
    }
  });

  // データ保存
  document.getElementById('plantForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('errorMsg');
    
    const cropName = document.getElementById('cropName').value.trim();
    const leafCount = Number(document.getElementById('leafCount').value);
    const height = Number(document.getElementById('height').value);
    const date = document.getElementById('recordDate').value;
    const memo = document.getElementById('memo').value.trim();

    if (!cropName || isNaN(leafCount) || isNaN(height) || !date || leafCount < 0 || height < 0) {
      errorMsg.style.display = 'block';
      return;
    }
    errorMsg.style.display = 'none';

    try {
      await addDoc(colRef, {
        cropName,
        leafCount,
        height,
        date,
        memo,
        createdAt: new Date()
      });
      document.getElementById('plantForm').reset();
      document.getElementById('recordDate').valueAsDate = new Date();
    } catch (err) {
      console.error("保存失敗:", err);
      alert("データの保存に失敗しました。");
    }
  });

  // データ読み込み
  function loadRecords() {
    const q = query(colRef, orderBy("date", "asc"));
    onSnapshot(q, (snapshot) => {
      allRecords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderData();
    });
  }

  // 描画・フィルター処理
  window.renderData = () => {
    const listEl = document.getElementById('recordList');
    const filterText = document.getElementById('filterInput').value.toLowerCase();
    listEl.innerHTML = '';

    const filtered = allRecords.filter(r => r.cropName.toLowerCase().includes(filterText));
    const displayRecords = [...filtered].reverse();

    if (displayRecords.length === 0) {
      listEl.innerHTML = '<p style="color:#888; text-align:center;">該当する記録がありません。</p>';
    }

    displayRecords.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">${escapeHtml(r.cropName)}</div>
        <div class="card-date">📅 ${r.date}</div>
        <div class="card-detail">🍃 葉枚数: <b>${r.leafCount}</b> 枚 / 📏 草丈: <b>${r.height}</b> cm</div>
        <div style="font-size:0.9rem; color:#555;">📝 ${escapeHtml(r.memo || 'メモなし')}</div>
        <button class="delete-btn" onclick="deleteRecord('${r.id}')">削除</button>
      `;
      listEl.appendChild(card);
    });

    updateChart(filtered);
  };

  // データ削除
  window.deleteRecord = async (id) => {
    if (confirm("この記録を削除しますか？")) {
      try {
        await deleteDoc(doc(db, "records", id));
      } catch (err) {
        console.error("削除失敗:", err);
        alert("削除に失敗しました。");
      }
    }
  };

  // グラフ描画
  function updateChart(data) {
    const ctx = document.getElementById('growthChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.map(r => r.date),
        datasets: [
          { label: '草丈 (cm)', data: data.map(r => r.height), borderColor: '#2e7d32', backgroundColor: 'rgba(46, 125, 50, 0.1)', fill: true, tension: 0.2 },
          { label: '葉枚数 (枚)', data: data.map(r => r.leafCount), borderColor: '#f57c00', backgroundColor: 'rgba(245, 124, 0, 0.1)', fill: true, tension: 0.2 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: true, scales: { y: { beginAtZero: true } } }
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
</script>
</body>
</html>
